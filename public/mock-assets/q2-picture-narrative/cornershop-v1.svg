<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="cornerShopTitle cornerShopDesc">
  <title id="cornerShopTitle">The Corner Shop</title>
  <desc id="cornerShopDesc">A small corner shop on a dark street at night. A sign hanging in the door says CLOSED, but the lights are still on at the back of the shop, and the shadow of a person can be seen on the blind. The shop door is open a few centimetres, with a small bell hanging above it. A trail of brightly wrapped sweets leads from the doorway across the pavement, and a broken glass jar lies on its side just inside. A child's bicycle has been dropped on the pavement beside the door, its front wheel still spinning. A small dog is tied to the lamp post and is staring at the door, with a loose lead trailing on the ground. A handwritten note is taped to the inside of the window, but the writing is too small and smudged to read.</desc>
  <!-- Original illustration authored directly for Angel 11+ (CSSE Completion, English Form B supply, SEALED Mock candidate). Flat vector art, no photographic or third-party source. Distinct from every Practice picture prompt and from the Mock-held old shed: an urban night street, artificial light, and its own story footholds (a closed sign over lit rooms, a shadow behind the blind, a trail of sweets, a dropped bicycle with a spinning wheel, a dog left waiting, a note nobody can read). Must NOT be reused in Practice. -->
  <defs>
    <linearGradient id="csSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16233b"/>
      <stop offset="100%" stop-color="#2d3f5e"/>
    </linearGradient>
    <radialGradient id="csLampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9a8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="csShopGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd98a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#csSky)"/>
  <circle cx="90" cy="80" r="30" fill="#f3efd8"/><circle cx="104" cy="72" r="26" fill="#16233b"/>
  <g fill="#f3efd8" opacity="0.8"><circle cx="220" cy="50" r="2"/><circle cx="330" cy="90" r="2"/><circle cx="420" cy="40" r="2"/><circle cx="560" cy="70" r="2"/><circle cx="700" cy="40" r="2"/><circle cx="760" cy="110" r="2"/></g>

  <!-- neighbouring buildings -->
  <rect x="0" y="170" width="180" height="300" fill="#26354f"/><rect x="620" y="150" width="180" height="320" fill="#26354f"/>
  <g fill="#3a4c6b"><rect x="24" y="200" width="30" height="40"/><rect x="90" y="200" width="30" height="40"/><rect x="24" y="270" width="30" height="40"/><rect x="90" y="270" width="30" height="40"/><rect x="650" y="190" width="30" height="40"/><rect x="720" y="190" width="30" height="40"/><rect x="650" y="260" width="30" height="40"/><rect x="720" y="260" width="30" height="40"/></g>

  <!-- the shop -->
  <rect x="190" y="150" width="420" height="320" fill="#7b4a3a"/>
  <rect x="190" y="150" width="420" height="30" fill="#4d2e25"/>
  <rect x="215" y="115" width="370" height="46" fill="#2f4a3a"/>
  <text x="400" y="147" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#f3e7c0">CORNER SHOP</text>
  <!-- striped awning -->
  <g>
    <path d="M200 180 L600 180 L620 225 L180 225 Z" fill="#b8423a"/>
    <path d="M240 180 L280 180 L270 225 L225 225 Z M320 180 L360 180 L355 225 L310 225 Z M400 180 L440 180 L440 225 L395 225 Z M480 180 L520 180 L525 225 L480 225 Z M560 180 L600 180 L615 225 L570 225 Z" fill="#f3e7c0"/>
  </g>
  <!-- window with warm light, blind and a person's shadow -->
  <rect x="215" y="245" width="190" height="170" fill="#ffd98a"/>
  <circle cx="310" cy="330" r="160" fill="url(#csShopGlow)"/>
  <rect x="225" y="255" width="170" height="150" fill="#f1d9a0"/>
  <g stroke="#d9bd7a" stroke-width="3"><line x1="225" y1="275" x2="395" y2="275"/><line x1="225" y1="295" x2="395" y2="295"/><line x1="225" y1="315" x2="395" y2="315"/><line x1="225" y1="335" x2="395" y2="335"/><line x1="225" y1="355" x2="395" y2="355"/><line x1="225" y1="375" x2="395" y2="375"/><line x1="225" y1="395" x2="395" y2="395"/></g>
  <!-- shadow on the blind -->
  <path d="M300 405 L298 340 Q296 318 312 314 Q330 318 328 340 L326 405 Z" fill="#6b5a3a" opacity="0.7"/>
  <circle cx="313" cy="305" r="12" fill="#6b5a3a" opacity="0.7"/>
  <path d="M326 345 L350 330" stroke="#6b5a3a" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <!-- note taped inside the window -->
  <rect x="236" y="262" width="44" height="52" fill="#fbf6e8" stroke="#a9a089"/>
  <path d="M241 272 L274 270 M240 281 L271 283 M242 291 L276 289 M240 300 L266 302" stroke="#8a8372" stroke-width="2" fill="none" opacity="0.7"/>
  <rect x="238" y="258" width="14" height="6" fill="#e8c84a" opacity="0.8"/>

  <!-- door, slightly open, bell above, CLOSED sign -->
  <rect x="440" y="245" width="130" height="225" fill="#3a2a22"/>
  <rect x="452" y="258" width="106" height="140" fill="#2a1f19"/>
  <path d="M452 258 L558 258 L558 398 L452 398 Z" fill="#ffd98a" opacity="0.28"/>
  <rect x="528" y="255" width="26" height="205" fill="#ffd98a" opacity="0.55"/>
  <circle cx="505" cy="236" r="9" fill="#e8c84a"/><rect x="503" y="226" width="4" height="8" fill="#8a6d12"/>
  <rect x="470" y="288" width="64" height="30" rx="3" fill="#fbf6e8" stroke="#a9a089"/>
  <text x="502" y="309" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#b8423a">CLOSED</text>
  <circle cx="460" cy="360" r="5" fill="#e8c84a"/>
  <!-- lit back of shop seen through the gap -->
  <rect x="530" y="270" width="22" height="100" fill="#fff1b0" opacity="0.7"/>

  <!-- pavement and road -->
  <rect x="0" y="470" width="800" height="130" fill="#5a6270"/>
  <rect x="0" y="470" width="800" height="26" fill="#7a8290"/>
  <g stroke="#6a7280" stroke-width="2"><line x1="150" y1="496" x2="120" y2="600"/><line x1="350" y1="496" x2="340" y2="600"/><line x1="560" y1="496" x2="570" y2="600"/><line x1="760" y1="496" x2="790" y2="600"/></g>

  <!-- broken glass jar just inside, sweets trailing out -->
  <path d="M540 452 L575 440 L585 462 L548 470 Z" fill="#cfe6e0" opacity="0.8" stroke="#9aa3a6"/>
  <g>
    <circle cx="580" cy="486" r="7" fill="#d93a2b"/><circle cx="608" cy="502" r="7" fill="#e8c84a"/><circle cx="634" cy="494" r="7" fill="#3f8a5a"/><circle cx="661" cy="514" r="7" fill="#d93a2b"/><circle cx="690" cy="528" r="7" fill="#e8c84a"/><circle cx="716" cy="522" r="7" fill="#2d6fb5"/><circle cx="744" cy="548" r="7" fill="#d93a2b"/><circle cx="772" cy="560" r="7" fill="#3f8a5a"/>
  </g>

  <!-- the dropped bicycle, front wheel still spinning -->
  <g>
    <circle cx="352" cy="548" r="42" fill="none" stroke="#2f3a42" stroke-width="6"/>
    <circle cx="352" cy="548" r="42" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="6 14" opacity="0.8"/>
    <path d="M318 520 A46 46 0 0 1 366 508" fill="none" stroke="#9fb0c4" stroke-width="3" opacity="0.7"/>
    <circle cx="232" cy="552" r="38" fill="none" stroke="#2f3a42" stroke-width="6"/>
    <path d="M232 552 L292 512 L352 548 M292 512 L256 520 L232 552 M292 512 L310 490 L336 488" fill="none" stroke="#d93a2b" stroke-width="6" stroke-linecap="round"/>
    <path d="M326 484 L346 486" stroke="#2f3a42" stroke-width="7" stroke-linecap="round"/>
    <line x1="352" y1="548" x2="352" y2="510" stroke="#2f3a42" stroke-width="3"/><line x1="352" y1="548" x2="388" y2="548" stroke="#2f3a42" stroke-width="3"/>
  </g>

  <!-- lamp post with the waiting dog -->
  <rect x="150" y="190" width="9" height="300" fill="#2f3a42"/>
  <circle cx="154" cy="182" r="60" fill="url(#csLampGlow)"/>
  <circle cx="154" cy="182" r="14" fill="#fff1b0"/>
  <rect x="140" y="168" width="28" height="8" fill="#2f3a42"/>
  <g>
    <ellipse cx="205" cy="505" rx="34" ry="22" fill="#8a6a45"/>
    <circle cx="238" cy="486" r="17" fill="#8a6a45"/>
    <path d="M232 470 L224 450 L244 466 Z M246 474 L258 456 L252 482 Z" fill="#6d4f2d"/>
    <circle cx="244" cy="484" r="3" fill="#2f3a42"/><ellipse cx="254" cy="492" rx="5" ry="4" fill="#2f3a42"/>
    <rect x="180" y="516" width="8" height="18" fill="#6d4f2d"/><rect x="216" y="516" width="8" height="18" fill="#6d4f2d"/>
    <path d="M232 498 Q240 506 232 512" fill="none" stroke="#d93a2b" stroke-width="4"/><circle cx="232" cy="512" r="4" fill="#e8c84a"/>
    <path d="M160 488 Q150 520 170 540 Q196 556 214 546" fill="none" stroke="#3f4d57" stroke-width="3"/>
