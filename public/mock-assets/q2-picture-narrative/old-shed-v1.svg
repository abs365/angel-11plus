<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="oldShedTitle oldShedDesc">
  <title id="oldShedTitle">The Old Shed</title>
  <desc id="oldShedDesc">An old wooden shed stands at the edge of an overgrown garden in the late afternoon. Its door is slightly open, and long grass and climbing plants have grown up around its base. A large tree stands beside it, and two birds fly across a warm, softening sky.</desc>

  <!-- Original illustration authored directly for Angel 11+, Migration 246. Flat/stylised vector art, no photographic or copyrighted source material of any kind. -->

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe3f0"/>
      <stop offset="55%" stop-color="#f6d9a8"/>
      <stop offset="100%" stop-color="#f3c07f"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fb35a"/>
      <stop offset="100%" stop-color="#6f9a45"/>
    </linearGradient>
    <linearGradient id="shedWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9764f"/>
      <stop offset="100%" stop-color="#8a5d3b"/>
    </linearGradient>
    <linearGradient id="shedWallSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5d3b"/>
      <stop offset="100%" stop-color="#6f4a2e"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4d6" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fff4d6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="800" height="420" fill="url(#sky)"/>
  <circle cx="640" cy="120" r="120" fill="url(#sun)"/>
  <circle cx="640" cy="120" r="38" fill="#fff0c9"/>

  <!-- Distant tree line -->
  <g opacity="0.55">
    <ellipse cx="80" cy="360" rx="70" ry="34" fill="#7fa25c"/>
    <ellipse cx="150" cy="368" rx="55" ry="26" fill="#89aa63"/>
    <ellipse cx="700" cy="358" rx="80" ry="30" fill="#7fa25c"/>
  </g>

  <!-- Birds -->
  <g stroke="#5a4634" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M 500 90 q 12 -14 24 0 q 12 -14 24 0"/>
    <path d="M 560 130 q 10 -11 20 0 q 10 -11 20 0"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="380" width="800" height="220" fill="url(#grass)"/>

  <!-- Garden path -->
  <polygon points="330,600 470,600 420,388 380,388" fill="#c9b691"/>
  <polygon points="345,600 455,600 412,394 388,394" fill="#d9c8a3"/>
  <g fill="#b6a380" opacity="0.7">
    <ellipse cx="380" cy="560" rx="14" ry="7"/>
    <ellipse cx="430" cy="520" rx="12" ry="6"/>
    <ellipse cx="390" cy="480" rx="10" ry="5"/>
    <ellipse cx="415" cy="440" rx="8" ry="4"/>
  </g>

  <!-- Large tree beside the shed -->
  <g>
    <path d="M 620 600 C 615 520 622 470 618 430 C 616 410 630 400 636 430 C 640 470 646 520 642 600 Z" fill="#6f4a2e"/>
    <ellipse cx="628" cy="360" rx="115" ry="95" fill="#79a24f"/>
    <ellipse cx="560" cy="390" rx="70" ry="60" fill="#6f9846"/>
    <ellipse cx="700" cy="385" rx="75" ry="62" fill="#6f9846"/>
    <ellipse cx="628" cy="330" rx="80" ry="55" fill="#87ac5c"/>
  </g>

  <!-- Overgrown grass/plants along the front -->
  <g fill="#5f8a3f">
    <path d="M 40 600 q 6 -46 0 -70 q 10 30 8 70 Z"/>
    <path d="M 70 600 q 10 -60 -4 -84 q 18 34 10 84 Z"/>
    <path d="M 100 600 q 4 -40 -8 -60 q 14 24 12 60 Z"/>
    <path d="M 740 600 q 8 -50 -2 -74 q 16 28 8 74 Z"/>
    <path d="M 770 600 q 4 -36 -10 -54 q 14 20 12 54 Z"/>
  </g>

  <!-- The shed -->
  <g>
    <!-- Side wall (perspective) -->
    <polygon points="470,430 540,410 540,600 470,600" fill="url(#shedWallSide)"/>
    <!-- Front wall -->
    <rect x="290" y="410" width="180" height="190" fill="url(#shedWall)"/>
    <!-- Plank lines on the front wall -->
    <g stroke="#6f4a2e" stroke-width="2" opacity="0.55">
      <line x1="320" y1="410" x2="320" y2="600"/>
      <line x1="350" y1="410" x2="350" y2="600"/>
      <line x1="380" y1="410" x2="380" y2="600"/>
      <line x1="410" y1="410" x2="410" y2="600"/>
      <line x1="440" y1="410" x2="440" y2="600"/>
    </g>
    <!-- Roof -->
    <polygon points="275,412 380,352 560,378 470,432" fill="#5c4632"/>
    <polygon points="275,412 380,352 380,368 285,424" fill="#4a3826"/>
    <!-- Small window -->
    <rect x="300" y="440" width="46" height="46" rx="3" fill="#dcecef" stroke="#5c4632" stroke-width="4"/>
    <line x1="323" y1="440" x2="323" y2="486" stroke="#5c4632" stroke-width="3"/>
    <line x1="300" y1="463" x2="346" y2="463" stroke="#5c4632" stroke-width="3"/>
    <!-- Door frame -->
    <rect x="392" y="440" width="62" height="160" fill="#4a3826"/>
    <!-- Door, ajar -->
    <g transform="translate(454,440)">
      <rect x="-6" y="0" width="54" height="160" fill="#7a5738" transform="skewY(-6)"/>
      <circle cx="4" cy="82" r="4" fill="#e7c873"/>
    </g>
    <!-- Dark gap where the door has swung open -->
    <polygon points="392,440 400,600 412,600 402,440" fill="#241a10"/>
  </g>

  <!-- Climbing plant up the shed's side wall -->
  <g stroke="#4a6b2f" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M 480 600 C 470 540 495 500 478 450 C 470 425 495 415 486 400"/>
  </g>
  <g fill="#6f9846">
    <circle cx="480" cy="560" r="7"/>
    <circle cx="472" cy="520" r="7"/>
    <circle cx="490" cy="480" r="6"/>
    <circle cx="478" cy="440" r="6"/>
    <circle cx="488" cy="410" r="5"/>
  </g>

  <!-- Foreground tufts of grass in front of the shed -->
  <g fill="#5f8a3f">
    <path d="M 270 600 q 8 -30 0 -46 q 12 20 8 46 Z"/>
    <path d="M 300 600 q 6 -24 -2 -38 q 10 16 8 38 Z"/>
    <path d="M 480 600 q 8 -28 0 -44 q 12 18 8 44 Z"/>
    <path d="M 520 600 q 10 -34 -2 -52 q 16 22 10 52 Z"/>
  </g>
</svg>
