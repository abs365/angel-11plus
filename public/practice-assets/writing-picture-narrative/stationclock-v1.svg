<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="stationClockTitle stationClockDesc">
  <title id="stationClockTitle">The Station Clock</title>
  <desc id="stationClockDesc">A small railway platform in the late afternoon. A large station clock on the wall has stopped at ten past five, although a lamp beside it is already lit. A brown suitcase stands alone in the middle of the platform with a paper luggage tag half torn off and hanging by a thread. A red scarf is snagged on the iron fence beside a bench, and a folded ticket with a time circled in red lies on the bench. Far along the platform a figure in a long grey coat stands at the very edge, back turned, looking down the empty track where the rear lights of a train are shrinking into the distance.</desc>
  <!-- Original illustration authored directly for Angel 11+ (CSSE Completion, Priority 4). Flat vector art, no photographic or third-party source. Deliberately distinct from the Treehouse Lantern (garden, midday, treehouse), the Mock-reserved old-shed picture and the rejected riverboat: a different setting (railway platform), late-afternoon light, and its own set of story footholds (a stopped clock, an abandoned suitcase with a torn tag, a snagged scarf, a circled ticket, a watcher who stayed behind, a train just gone). -->
  <defs>
    <linearGradient id="scSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9b98a"/>
      <stop offset="55%" stop-color="#f3d9b4"/>
      <stop offset="100%" stop-color="#f7ead2"/>
    </linearGradient>
    <radialGradient id="scLampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1b0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff1b0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#scSky)"/>
  <!-- far hills -->
  <path d="M0 330 Q120 270 260 320 T520 300 T800 320 L800 380 L0 380 Z" fill="#a9b59a"/>
  <path d="M0 360 Q160 320 330 355 T640 340 T800 360 L800 400 L0 400 Z" fill="#8fa081"/>

  <!-- track bed and rails -->
  <rect x="0" y="395" width="800" height="70" fill="#7a6a5c"/>
  <rect x="0" y="410" width="800" height="6" fill="#4d4640"/>
  <rect x="0" y="440" width="800" height="6" fill="#4d4640"/>
  <g stroke="#5b4a3a" stroke-width="5">
    <line x1="40" y1="405" x2="30" y2="452"/><line x1="120" y1="405" x2="112" y2="452"/><line x1="200" y1="405" x2="196" y2="452"/>
    <line x1="280" y1="405" x2="278" y2="452"/><line x1="360" y1="405" x2="360" y2="452"/><line x1="440" y1="405" x2="442" y2="452"/>
    <line x1="520" y1="405" x2="524" y2="452"/><line x1="600" y1="405" x2="606" y2="452"/><line x1="680" y1="405" x2="688" y2="452"/>
  </g>

  <!-- the train that has just left: small, far left, red rear light -->
  <g>
    <rect x="22" y="378" width="70" height="28" rx="4" fill="#586c7a"/>
    <rect x="30" y="384" width="12" height="10" fill="#f7e7a0"/><rect x="48" y="384" width="12" height="10" fill="#f7e7a0"/><rect x="66" y="384" width="12" height="10" fill="#f7e7a0"/>
    <circle cx="94" cy="398" r="5" fill="#d93a2b"/>
    <circle cx="94" cy="398" r="12" fill="#d93a2b" opacity="0.25"/>
    <ellipse cx="14" cy="360" rx="16" ry="9" fill="#f1ece6" opacity="0.8"/><ellipse cx="34" cy="348" rx="14" ry="8" fill="#f1ece6" opacity="0.65"/>
  </g>

  <!-- platform -->
  <rect x="0" y="465" width="800" height="135" fill="#b9b2a8"/>
  <rect x="0" y="465" width="800" height="12" fill="#8c857b"/>
  <rect x="0" y="480" width="800" height="7" fill="#e8c84a"/>
  <g stroke="#a29b91" stroke-width="2">
    <line x1="0" y1="520" x2="800" y2="520"/><line x1="0" y1="565" x2="800" y2="565"/>
    <line x1="160" y1="487" x2="130" y2="600"/><line x1="360" y1="487" x2="350" y2="600"/><line x1="560" y1="487" x2="570" y2="600"/><line x1="760" y1="487" x2="790" y2="600"/>
  </g>

  <!-- station building (right) -->
  <rect x="470" y="110" width="330" height="355" fill="#a65e45"/>
  <rect x="470" y="110" width="330" height="22" fill="#7f4332"/>
  <g stroke="#8d4f39" stroke-width="2">
    <line x1="470" y1="170" x2="800" y2="170"/><line x1="470" y1="230" x2="800" y2="230"/><line x1="470" y1="290" x2="800" y2="290"/><line x1="470" y1="350" x2="800" y2="350"/><line x1="470" y1="410" x2="800" y2="410"/>
  </g>
  <rect x="440" y="96" width="360" height="16" fill="#3f4d57"/>
  <rect x="690" y="330" width="70" height="135" fill="#4b6a52"/>
  <rect x="696" y="338" width="58" height="50" fill="#cfe6e0"/>
  <circle cx="748" cy="410" r="4" fill="#e8c84a"/>
  <rect x="500" y="320" width="60" height="70" fill="#3b4750"/><rect x="590" y="320" width="60" height="70" fill="#3b4750"/>

  <!-- THE CLOCK: stopped at ten past five -->
  <circle cx="590" cy="225" r="64" fill="#2f3a42"/>
  <circle cx="590" cy="225" r="56" fill="#fbf6e8"/>
  <g stroke="#2f3a42" stroke-width="3">
    <line x1="590" y1="173" x2="590" y2="184"/><line x1="642" y1="225" x2="631" y2="225"/><line x1="590" y1="277" x2="590" y2="266"/><line x1="538" y1="225" x2="549" y2="225"/>
  </g>
  <line x1="590" y1="225" x2="609" y2="258" stroke="#2f3a42" stroke-width="7" stroke-linecap="round"/>
  <line x1="590" y1="225" x2="630" y2="200" stroke="#2f3a42" stroke-width="4" stroke-linecap="round"/>
  <circle cx="590" cy="225" r="5" fill="#d93a2b"/>
  <path d="M556 200 L575 214 L568 226 L584 238" fill="none" stroke="#9aa3a6" stroke-width="2"/>

  <!-- lamp already lit beside the clock -->
  <rect x="480" y="190" width="6" height="140" fill="#2f3a42"/>
  <circle cx="483" cy="182" r="38" fill="url(#scLampGlow)"/>
  <circle cx="483" cy="182" r="11" fill="#fff1b0"/>
  <rect x="474" y="170" width="18" height="6" fill="#2f3a42"/>

  <!-- iron fence and snagged red scarf -->
  <g stroke="#3f4d57" stroke-width="4">
    <line x1="60" y1="510" x2="60" y2="440"/><line x1="100" y1="510" x2="100" y2="440"/><line x1="140" y1="510" x2="140" y2="440"/><line x1="180" y1="510" x2="180" y2="440"/><line x1="220" y1="510" x2="220" y2="440"/><line x1="260" y1="510" x2="260" y2="440"/>
    <line x1="50" y1="455" x2="275" y2="455"/><line x1="50" y1="495" x2="275" y2="495"/>
  </g>
  <path d="M100 455 Q120 470 112 500 Q106 520 122 536" fill="none" stroke="#d93a2b" stroke-width="12" stroke-linecap="round"/>
  <path d="M100 455 Q86 458 92 470" fill="none" stroke="#d93a2b" stroke-width="10" stroke-linecap="round"/>

  <!-- bench with folded ticket (time circled in red) -->
  <rect x="290" y="498" width="130" height="10" fill="#7b5a3a"/>
  <rect x="294" y="470" width="122" height="8" fill="#7b5a3a"/>
  <rect x="294" y="478" width="8" height="30" fill="#5b4a3a"/><rect x="408" y="478" width="8" height="30" fill="#5b4a3a"/>
  <rect x="322" y="487" width="46" height="12" rx="2" fill="#fbf6e8" stroke="#8c857b"/>
  <circle cx="345" cy="493" r="6" fill="none" stroke="#d93a2b" stroke-width="2"/>
  <line x1="330" y1="493" x2="338" y2="493" stroke="#4d4640" stroke-width="2"/>

  <!-- THE SUITCASE: alone, tag half torn off -->
  <rect x="520" y="505" width="86" height="58" rx="6" fill="#8a5a36"/>
  <rect x="520" y="505" width="86" height="10" fill="#6d4426"/>
  <rect x="556" y="496" width="14" height="10" rx="2" fill="none" stroke="#3f2a17" stroke-width="3"/>
  <rect x="528" y="527" width="12" height="8" fill="#e8c84a"/><rect x="586" y="527" width="12" height="8" fill="#e8c84a"/>
  <path d="M606 523 Q626 532 622 556" fill="none" stroke="#b9a37b" stroke-width="2"/>
  <path d="M618 556 L634 556 L631 572 L618 569 Z" fill="#fbf6e8" stroke="#8c857b"/>
  <line x1="622" y1="561" x2="630" y2="561" stroke="#4d4640" stroke-width="1.5"/>
  <path d="M618 569 L624 575 L621 580" fill="none" stroke="#8c857b" stroke-width="1.5"/>
  <ellipse cx="563" cy="566" rx="46" ry="6" fill="#8c857b" opacity="0.35"/>

  <!-- THE WATCHER: long grey coat, back turned, at the very edge, far along the platform -->
  <g transform="translate(132,0)">
    <ellipse cx="300" cy="474" rx="16" ry="3" fill="#8c857b" opacity="0.4"/>
    <path d="M286 474 L290 420 Q300 404 310 420 L314 474 Z" fill="#59636b"/>
    <circle cx="300" cy="410" r="9" fill="#d9b48f"/>
    <path d="M290 410 Q300 396 310 410 Z" fill="#3d454c"/>
  </g>
</svg>
