<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="riverboatTitle riverboatDesc">
  <title id="riverboatTitle">The Riverboat at Dawn</title>
  <desc id="riverboatDesc">A small wooden rowing boat rests on a misty riverbank at dawn. Its oars lie across the bench seats, and a rope trails loosely into the still water. A bicycle leans against a nearby willow tree, and pale morning light glows through drifting mist over the river.</desc>

  <!-- Original illustration authored directly for Angel 11+, Educational Depth Phase 1 Wave 2. Flat/stylised vector art, no photographic or copyrighted source material of any kind. Deliberately distinct from migration 246's old-shed-v1.svg (Mock-reserved): different setting, time of day, mood, and implied presence (a bicycle, no visible person), so Practice never previews the exact scene a learner could later meet in a sealed Mock sitting. -->

  <defs>
    <linearGradient id="dawnSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fa9c9"/>
      <stop offset="45%" stop-color="#e8c2c9"/>
      <stop offset="80%" stop-color="#f6dfc2"/>
      <stop offset="100%" stop-color="#f8ecd6"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9c2c9"/>
      <stop offset="100%" stop-color="#7fa0aa"/>
    </linearGradient>
    <linearGradient id="bank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7d9a5f"/>
      <stop offset="100%" stop-color="#5f7a45"/>
    </linearGradient>
    <radialGradient id="dawnGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff2d9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff2d9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boatWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9764f"/>
      <stop offset="100%" stop-color="#7a5738"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="800" height="330" fill="url(#dawnSky)"/>
  <circle cx="150" cy="230" r="150" fill="url(#dawnGlow)"/>
  <circle cx="150" cy="230" r="34" fill="#fff4da"/>

  <!-- Distant far bank, softened by mist -->
  <g opacity="0.4">
    <ellipse cx="700" cy="300" rx="130" ry="34" fill="#8fae6f"/>
    <ellipse cx="600" cy="310" rx="90" ry="24" fill="#9ab77c"/>
  </g>

  <!-- River -->
  <rect x="0" y="300" width="800" height="130" fill="url(#river)"/>
  <g stroke="#c9dade" stroke-width="2" opacity="0.5" fill="none">
    <path d="M 480 340 q 40 8 80 0"/>
    <path d="M 520 370 q 50 10 100 0"/>
    <path d="M 460 400 q 44 9 88 0"/>
  </g>

  <!-- Mist drifting over the water -->
  <g fill="#f4f0e6" opacity="0.55">
    <ellipse cx="560" cy="330" rx="120" ry="22"/>
    <ellipse cx="680" cy="350" rx="90" ry="18"/>
    <ellipse cx="420" cy="360" rx="100" ry="16"/>
  </g>

  <!-- Riverbank ground -->
  <rect x="0" y="430" width="800" height="170" fill="url(#bank)"/>

  <!-- Willow tree -->
  <g>
    <path d="M 130 600 C 126 500 132 440 128 400 C 126 384 140 378 144 400 C 148 440 152 500 148 600 Z" fill="#5f4530"/>
    <ellipse cx="136" cy="340" rx="95" ry="70" fill="#7fa05a"/>
  </g>
  <g stroke="#6f8a4a" stroke-width="3" fill="none" opacity="0.85" stroke-linecap="round">
    <path d="M 90 330 q -10 90 -6 170"/>
    <path d="M 120 320 q -4 100 2 190"/>
    <path d="M 150 322 q 6 96 4 188"/>
    <path d="M 180 330 q 12 90 8 170"/>
  </g>

  <!-- Grass tufts -->
  <g fill="#4e6b35">
    <path d="M 40 600 q 6 -40 0 -60 q 10 26 8 60 Z"/>
    <path d="M 250 600 q 6 -34 -2 -50 q 12 20 8 50 Z"/>
    <path d="M 620 600 q 8 -44 -2 -66 q 14 24 10 66 Z"/>
    <path d="M 760 600 q 6 -34 -8 -50 q 14 20 10 50 Z"/>
  </g>

  <!-- The rowing boat, pulled up on the bank -->
  <g>
    <path d="M 330 520 C 350 552 470 552 500 520 L 480 486 C 450 500 380 500 350 486 Z" fill="url(#boatWood)"/>
    <path d="M 330 520 C 350 552 470 552 500 520 L 494 528 C 460 556 370 556 336 528 Z" fill="#5f4530"/>
    <!-- Bench seats -->
    <line x1="368" y1="490" x2="368" y2="512" stroke="#4a3826" stroke-width="5"/>
    <line x1="460" y1="490" x2="460" y2="512" stroke="#4a3826" stroke-width="5"/>
    <!-- Oars, crossed and resting across the seats -->
    <g stroke="#8a6a45" stroke-width="6" stroke-linecap="round">
      <line x1="345" y1="475" x2="485" y2="500"/>
      <line x1="345" y1="500" x2="485" y2="475"/>
    </g>
  </g>

  <!-- Rope trailing from the boat into the water -->
  <path d="M 335 515 C 300 530 260 520 220 470 C 200 445 190 410 205 390" stroke="#c9b691" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Bicycle leaning against the willow's trunk -->
  <g stroke="#3c3c3c" stroke-width="4" fill="none" stroke-linecap="round">
    <circle cx="210" cy="560" r="30"/>
    <circle cx="290" cy="560" r="30"/>
    <path d="M 210 560 L 250 505 L 290 560"/>
    <path d="M 250 505 L 235 560"/>
    <path d="M 250 505 L 262 490 L 275 495"/>
    <path d="M 210 560 L 235 560"/>
  </g>
  <circle cx="210" cy="560" r="4" fill="#3c3c3c"/>
  <circle cx="290" cy="560" r="4" fill="#3c3c3c"/>
</svg>
