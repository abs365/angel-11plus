<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="libraryTitle libraryDesc">
  <title id="libraryTitle">After Closing Time</title>
  <desc id="libraryDesc">The inside of a small school library at night, long after closing. One green reading lamp is still switched on over a table. On the table an old book lies open with a small brass key resting in the middle of the page. A tall wooden ladder leans against the shelves, and one book high up sticks out further than all the rest. The window beside the shelves is open a little and the curtain is blowing into the room, with the moon outside. A trail of muddy footprints leads from the window across the floor to the table, and a torch lies on its side under the table, still shining a thin beam along the floor. The wall clock shows nearly midnight.</desc>
  <!-- Original illustration authored directly for Angel 11+ (CSSE Completion, Priority 4). Flat vector art, no photographic or third-party source. Distinct from the other picture prompts: an indoor night scene, lit by one lamp and the moon, with its own story footholds (an open window and muddy trail, a key in an open book, a book pulled out of place, a torch left shining, a clock near midnight). -->
  <defs>
    <linearGradient id="libWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d3a4a"/>
      <stop offset="100%" stop-color="#3b4a5c"/>
    </linearGradient>
    <radialGradient id="libLampGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#d8f2c0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#d8f2c0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="libMoon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4f1dc" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f4f1dc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#libWall)"/>

  <!-- floor -->
  <rect x="0" y="430" width="800" height="170" fill="#5a4636"/>
  <g stroke="#4a3a2d" stroke-width="2"><line x1="0" y1="470" x2="800" y2="470"/><line x1="0" y1="520" x2="800" y2="520"/><line x1="0" y1="570" x2="800" y2="570"/></g>

  <!-- bookshelves (left and centre-back) -->
  <g>
    <rect x="20" y="80" width="300" height="350" fill="#6a4a30"/>
    <rect x="30" y="90" width="280" height="330" fill="#4a3220"/>
    <g stroke="#6a4a30" stroke-width="6"><line x1="30" y1="170" x2="310" y2="170"/><line x1="30" y1="250" x2="310" y2="250"/><line x1="30" y1="330" x2="310" y2="330"/></g>
    <!-- rows of book spines -->
    <g>
      <rect x="38" y="116" width="14" height="54" fill="#8a3b3b"/><rect x="54" y="122" width="12" height="48" fill="#3b6a8a"/><rect x="68" y="112" width="16" height="58" fill="#c9a24b"/><rect x="86" y="120" width="12" height="50" fill="#4b7a4e"/><rect x="100" y="114" width="14" height="56" fill="#8a3b3b"/><rect x="116" y="124" width="12" height="46" fill="#5a5a8a"/><rect x="130" y="116" width="16" height="54" fill="#c9a24b"/><rect x="148" y="120" width="12" height="50" fill="#3b6a8a"/><rect x="162" y="112" width="14" height="58" fill="#8a3b3b"/><rect x="178" y="122" width="12" height="48" fill="#4b7a4e"/><rect x="192" y="116" width="16" height="54" fill="#c9a24b"/><rect x="210" y="120" width="12" height="50" fill="#8a3b3b"/><rect x="224" y="114" width="14" height="56" fill="#3b6a8a"/><rect x="240" y="124" width="12" height="46" fill="#4b7a4e"/><rect x="254" y="116" width="16" height="54" fill="#c9a24b"/><rect x="272" y="120" width="12" height="50" fill="#8a3b3b"/><rect x="286" y="112" width="14" height="58" fill="#5a5a8a"/>
      <rect x="38" y="196" width="16" height="54" fill="#4b7a4e"/><rect x="56" y="202" width="12" height="48" fill="#8a3b3b"/><rect x="70" y="194" width="14" height="56" fill="#3b6a8a"/><rect x="86" y="200" width="16" height="50" fill="#c9a24b"/><rect x="104" y="196" width="12" height="54" fill="#8a3b3b"/><rect x="118" y="204" width="14" height="46" fill="#4b7a4e"/><rect x="134" y="196" width="12" height="54" fill="#5a5a8a"/><rect x="148" y="200" width="16" height="50" fill="#c9a24b"/><rect x="166" y="194" width="12" height="56" fill="#3b6a8a"/><rect x="180" y="202" width="14" height="48" fill="#8a3b3b"/><rect x="196" y="196" width="16" height="54" fill="#4b7a4e"/><rect x="214" y="200" width="12" height="50" fill="#c9a24b"/><rect x="228" y="194" width="14" height="56" fill="#8a3b3b"/><rect x="244" y="204" width="12" height="46" fill="#3b6a8a"/><rect x="258" y="196" width="16" height="54" fill="#4b7a4e"/><rect x="276" y="200" width="12" height="50" fill="#5a5a8a"/>
      <rect x="38" y="276" width="14" height="54" fill="#c9a24b"/><rect x="54" y="282" width="16" height="48" fill="#3b6a8a"/><rect x="72" y="274" width="12" height="56" fill="#8a3b3b"/><rect x="86" y="280" width="14" height="50" fill="#4b7a4e"/><rect x="102" y="276" width="16" height="54" fill="#5a5a8a"/><rect x="120" y="284" width="12" height="46" fill="#c9a24b"/><rect x="134" y="276" width="14" height="54" fill="#8a3b3b"/><rect x="150" y="280" width="16" height="50" fill="#3b6a8a"/><rect x="168" y="274" width="12" height="56" fill="#4b7a4e"/><rect x="182" y="282" width="14" height="48" fill="#c9a24b"/><rect x="198" y="276" width="16" height="54" fill="#8a3b3b"/><rect x="216" y="280" width="12" height="50" fill="#5a5a8a"/><rect x="230" y="274" width="14" height="56" fill="#3b6a8a"/><rect x="246" y="284" width="12" height="46" fill="#4b7a4e"/><rect x="260" y="276" width="16" height="54" fill="#c9a24b"/><rect x="278" y="280" width="12" height="50" fill="#8a3b3b"/>
      <!-- the one book pulled out of line, high up -->
      <rect x="116" y="124" width="12" height="46" fill="#5a5a8a"/>
      <rect x="116" y="124" width="12" height="46" fill="#7a4a8a" transform="translate(14 0)"/>
      <rect x="130" y="108" width="12" height="62" fill="#e0d6b0" opacity="0.9"/>
    </g>
  </g>

  <!-- the ladder leaning on the shelves -->
  <g stroke="#9c7a4a" stroke-width="8" stroke-linecap="round">
    <line x1="288" y1="440" x2="206" y2="100"/><line x1="340" y1="440" x2="262" y2="100"/>
  </g>
  <g stroke="#b8935a" stroke-width="5">
    <line x1="283" y1="418" x2="338" y2="418"/><line x1="271" y1="368" x2="326" y2="368"/><line x1="258" y1="318" x2="314" y2="318"/><line x1="246" y1="268" x2="302" y2="268"/><line x1="234" y1="218" x2="290" y2="218"/><line x1="222" y1="168" x2="278" y2="168"/><line x1="210" y1="118" x2="266" y2="118"/>
  </g>

