  <g>
    <rect x="380" y="90" width="150" height="250" fill="#d7dcd2"/>
    <rect x="390" y="100" width="130" height="230" fill="#1c2733"/>
    <circle cx="470" cy="160" r="44" fill="url(#libMoon)"/>
    <circle cx="470" cy="160" r="20" fill="#f4f1dc"/>
    <line x1="455" y1="100" x2="455" y2="330" stroke="#d7dcd2" stroke-width="6"/>
    <!-- the open sash -->
    <path d="M455 330 L520 300 L520 110 L455 100 Z" fill="#2a3a4a" opacity="0.55"/>
    <rect x="380" y="338" width="150" height="10" fill="#b9bdb4"/>
    <!-- curtain blown inward -->
    <path d="M380 90 Q430 120 405 190 Q380 260 420 330 L380 330 Z" fill="#7e3b3b"/>
    <path d="M530 90 Q500 130 520 200 Q548 270 505 335 L530 335 Z" fill="#7e3b3b"/>
  </g>

  <!-- wall clock showing nearly midnight -->
  <circle cx="610" cy="130" r="38" fill="#2f3a42"/>
  <circle cx="610" cy="130" r="32" fill="#fbf6e8"/>
  <line x1="610" y1="130" x2="609" y2="105" stroke="#2f3a42" stroke-width="3" stroke-linecap="round"/>
  <line x1="610" y1="130" x2="607" y2="102" stroke="#d93a2b" stroke-width="2" stroke-linecap="round"/>
  <line x1="610" y1="130" x2="598" y2="116" stroke="#2f3a42" stroke-width="5" stroke-linecap="round"/>
  <circle cx="610" cy="130" r="3" fill="#2f3a42"/>

  <!-- reading table with lamp, open book and brass key -->
  <circle cx="570" cy="360" r="130" fill="url(#libLampGlow)"/>
  <rect x="470" y="400" width="210" height="14" fill="#8a6a45"/>
  <rect x="482" y="414" width="12" height="76" fill="#6a4a30"/><rect x="656" y="414" width="12" height="76" fill="#6a4a30"/>
  <!-- lamp -->
  <rect x="640" y="384" width="26" height="16" fill="#2f4a3a"/>
  <rect x="650" y="340" width="6" height="46" fill="#2f4a3a"/>
  <path d="M628 342 Q653 306 678 342 Z" fill="#3f8a5a"/>
  <ellipse cx="653" cy="344" rx="26" ry="5" fill="#d8f2c0"/>
  <!-- open book -->
  <path d="M510 398 L570 384 L630 398 L630 404 L570 392 L510 404 Z" fill="#6a3b2b"/>
  <path d="M514 396 L568 382 L568 392 L514 404 Z" fill="#fbf6e8"/>
  <path d="M572 382 L626 396 L626 404 L572 392 Z" fill="#f1ead4"/>
  <g stroke="#a9a089" stroke-width="1.5"><line x1="524" y1="394" x2="560" y2="386"/><line x1="524" y1="399" x2="560" y2="391"/><line x1="580" y1="388" x2="616" y2="396"/><line x1="580" y1="393" x2="616" y2="401"/></g>
  <!-- brass key resting in the page -->
  <g>
    <circle cx="566" cy="386" r="6" fill="none" stroke="#c9a24b" stroke-width="3"/>
    <line x1="572" y1="388" x2="590" y2="394" stroke="#c9a24b" stroke-width="3" stroke-linecap="round"/>
    <line x1="584" y1="392" x2="585" y2="398" stroke="#c9a24b" stroke-width="3"/><line x1="589" y1="394" x2="590" y2="399" stroke="#c9a24b" stroke-width="3"/>
  </g>

  <!-- the torch, on its side under the table, still shining -->
  <g>
    <path d="M440 462 L400 470 L400 484 L440 492 Z" fill="#fff3b0" opacity="0.35"/>
    <rect x="440" y="462" width="46" height="26" rx="5" fill="#2f3a42"/>
    <rect x="440" y="462" width="14" height="26" fill="#586c7a"/>
    <circle cx="440" cy="475" r="5" fill="#fff3b0"/>
  </g>

  <!-- muddy footprints from the window to the table -->
  <g fill="#3a2a1e" opacity="0.85">
    <ellipse cx="470" cy="452" rx="11" ry="6"/><ellipse cx="452" cy="476" rx="11" ry="6"/><ellipse cx="478" cy="498" rx="11" ry="6"/><ellipse cx="500" cy="520" rx="11" ry="6"/><ellipse cx="530" cy="500" rx="11" ry="6"/><ellipse cx="548" cy="470" rx="11" ry="6"/><ellipse cx="566" cy="445" rx="11" ry="6"/>
  </g>
  <rect x="460" y="345" width="40" height="12" fill="#3a2a1e" opacity="0.7"/>
</svg>
